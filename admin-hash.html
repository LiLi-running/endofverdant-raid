<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 비밀번호 해시 만들기</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
  input, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: inherit; }
  input { width: 100%; box-sizing: border-box; }
  button { margin-top: 10px; background: #4f46e5; border-color: #4f46e5; cursor: pointer; }
  code { display: block; word-break: break-all; background: #1f2937; padding: 10px; border-radius: 6px; margin-top: 10px; user-select: all; }
  small { color: #9ca3af; }
</style>
</head>
<body>
  <h2>관리자 비밀번호 해시 만들기</h2>
  <p>새 관리자 비밀번호를 입력하면 Firebase 콘솔의 <b>siteSecrets / admin</b> 문서의 <b>passwordHash</b> 필드에 넣을 값을 만들어 줍니다.</p>
  <p><small>계산은 이 브라우저 안에서만 이루어지고 어디로도 전송되지 않습니다.</small></p>
  <input id="pw" type="password" placeholder="새 관리자 비밀번호" autocomplete="new-password">
  <button id="go">해시 만들기</button>
  <code id="out">(여기에 결과가 표시됩니다)</code>
<script>
  // index.html 의 ADMIN_HASH_SALT 와 반드시 같아야 합니다.
  const ADMIN_HASH_SALT = 'endofverdant-raid-admin:';
  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  document.getElementById('go').onclick = async () => {
    const pw = document.getElementById('pw').value;
    document.getElementById('out').textContent = pw ? await sha256Hex(ADMIN_HASH_SALT + pw) : '비밀번호를 입력하세요.';
  };
</script>
</body>
</html>
